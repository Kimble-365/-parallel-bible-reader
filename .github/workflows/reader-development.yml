name: Parallel Reader project checks
on:
  push:
    branches: ['project/parallel-reader']
permissions:
  contents: read
concurrency:
  group: parallel-reader-project-checks
  cancel-in-progress: true
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install playwright lxml
      - run: sudo ln -sf /usr/bin/google-chrome /usr/bin/chromium
      - run: node tests/directory_discovery.cjs
      - run: python tests/directory_discovery.py
      - run: python tests/release_static_121.py
        env:
          READER_VERSION: '1.27'

      - name: Verify 1.28 reading fonts and inherited reading
        timeout-minutes: 6
        env:
          READER_VERSION: '1.28'
        run: |
          node tests/fonts_128.cjs
          python tests/fonts_128.py
          python tests/release_static_121.py
          python tests/reader_119.py

      - name: Verify KR33/38 formatting and quotation paths
        run: |
          node tests/kr1938_128.cjs
          python tests/kr1938_128.py

      - name: Verify 1.28 verse actions
        timeout-minutes: 5
        run: python tests/verse_actions_128.py

      - name: Verify 1.28 verse images and comparison
        timeout-minutes: 5
        run: |
          node tests/verse_media_128.cjs
          python tests/verse_media_128.py

      - name: Verify 1.28 introduction and prayer resources
        timeout-minutes: 5
        run: |
          node tests/faith_128.cjs
          python tests/faith_128.py

      - name: Detect package input changes
        id: package-inputs
        run: |
          python - <<'PY'
          import os,subprocess
          paths=subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD'],text=True).splitlines()
          def relevant(p):
            if p in {'releases/v1.28/README.md','releases/v1.28/RELEASE-1.28.md'}:return False
            return p.startswith(('releases/v1.28/','data/')) or p in {'tools/package_reader_128.py','tests/package_128.py'}
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write('build='+str(any(map(relevant,paths))).lower()+'\n')
          PY
      - name: Build and verify final 1.28 package
        if: steps.package-inputs.outputs.build == 'true'
        timeout-minutes: 12
        run: python tests/package_128.py --out "${{ runner.temp }}/reader-1.28-package" --commit "${{ github.sha }}"
      - name: Retain final 1.28 review ZIP and reports
        if: steps.package-inputs.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reader-1.28-review-package
          path: ${{ runner.temp }}/reader-1.28-package/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
