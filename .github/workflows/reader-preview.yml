name: Chapter width preview
on:
  push:
    branches: ['preview/chapter-width-127']
permissions:
  contents: read
jobs:
  width:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: sudo ln -sf /usr/bin/google-chrome /usr/bin/chromium
      - run: python tests/compact_127.py
