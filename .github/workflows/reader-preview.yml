name: Reader preview checks
on:
  push:
    branches: [main, 'preview/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reader:
    if: startsWith(github.ref, 'refs/heads/preview/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser and document readers
        run: |
          python -m pip install playwright python-docx python-pptx lxml
          if [ -x /usr/bin/google-chrome ]; then
            sudo ln -sf /usr/bin/google-chrome /usr/bin/chromium
          else
            python -m playwright install --with-deps chromium
            browser_path=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
            sudo ln -sf "$browser_path" /usr/bin/chromium
          fi
      - name: Verify sources, storage, search and exports
        env:
          READER_VERSION: '1.18'
        run: |
          python tests/languages_114.py
          python tests/languages_115.py
          python tests/release_static_115.py
          node tests/loader_notes_114.cjs
          node tests/loader_notes_115.cjs
          node tests/notes_model.cjs
          node tests/notes_ui.cjs
          node tests/search_engine.cjs
          node tests/simple_ui_115.cjs
          node tests/verse_text_116.cjs
          node tests/study_model_117.cjs
          python tests/release_static_117.py
          python tests/release_static_118.py
          python tests/create_sqlite_fixtures.py
          node tests/sqlite_reader_118.cjs
          node tests/rtf_reader_118.cjs
          node tests/bible_import_118.cjs
          python tests/nordic_sources_118.py
          node tests/nordic_loader_118.cjs
          python tests/japanese_sources_118.py
          node tests/japanese_reading_118.cjs
          python tests/release_static_116.py
          node tests/office_export_114.cjs
          python tests/office_open_114.py
      - name: Verify browser exports and offline reading (1.14)
        run: python tests/reader_114.py
      - name: Verify simplified reader and clean copy (1.16)
        env:
          READER_VERSION: '1.18'
        run: |
          python tests/simple_ui_115.py
          python tests/reading_copy_116.py
          python tests/study_menu_117.py
          python tests/import_browser_118.py
          python tests/nordic_japanese_browser_118.py
      - name: Verify 1.19 alignment, gzip compatibility, ruby and tracker
        run: |
          node tests/compatibility_119.cjs
          python tests/ruby_sources_119.py
          python tests/release_static_119.py
          python tests/reader_119.py
      - name: Verify existing reading features
        env:
          READER_VERSION: '1.14'
        run: |
          python tests/reader_v12.py
          python tests/search_112.py
          python tests/catalog_directory.py
          python tests/pronunciation_browser.py
          python tests/pwa_offline.py

  published-reader:
    env:
      READER_VERSION: '1.19'
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install playwright
          if [ -x /usr/bin/google-chrome ]; then
            sudo ln -sf /usr/bin/google-chrome /usr/bin/chromium
          else
            python -m playwright install --with-deps chromium
            browser_path=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
            sudo ln -sf "$browser_path" /usr/bin/chromium
          fi
      - name: Check current URL and original archive
        run: python tests/root_route.py
      - name: Verify deployed files
        run: python tests/public_release_115.py
